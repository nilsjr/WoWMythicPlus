name: Weekly npm Security Fixes

# Dependabot reports vulnerabilities in .kotlin-js-store/yarn.lock every week but can
# never fix them: the lockfile is generated by the Kotlin Gradle plugin and there is no
# package.json for the npm updater to open a PR against. Renovate's customManager keeps
# existing `resolution(...)` lines fresh, but cannot add a line for a package that was
# never pinned - which is exactly where every new advisory lands.
#
# So this workflow does it: scan the lockfile with osv-scanner, pin the HIGH/CRITICAL
# findings, regenerate the lockfile, prove the build still works, and open a PR that
# merges itself once CI is green.

on:
  # Friday evening, deliberately *before* Renovate's "before 5am on saturday" window
  # (Sat 00:00 - 05:00 UTC, since renovate.json5 sets no timezone). Landing the fixes
  # on develop first means Renovate wakes to an already-fixed tree and builds its
  # grouped PR on top, instead of racing an open security PR every week. Off-the-hour
  # to dodge the scheduling stampede GitHub gets on :00.
  schedule:
    - cron: '17 18 * * 5'  # Fri 18:17 UTC = 20:17 CEST / 19:17 CET
  workflow_dispatch:
    inputs:
      dry_run:
        # Rehearsal, not scan-only: the fix is still applied, the lockfile regenerated
        # and the build run, so a dispatch proves the whole pipeline end to end and
        # reports the result in the job summary. Only the branch, PR and merge are
        # withheld - the parts that are visible outside the run.
        description: 'Apply and verify the fix, but do not push a branch, open a PR or merge'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Every write goes through RELEASE_TOKEN instead, for the reasons documented on each
# step, so the default token needs nothing beyond reading the repository.
permissions:
  contents: read

env:
  OSV_SCANNER_VERSION: v2.5.1
  LOCKFILE: .kotlin-js-store/yarn.lock
  # The YarnRootExtension block lives in the :web module, not in the root build script.
  GRADLE_FILE: web/build.gradle.kts
  BRANCH: fix/security-yarn-lock

jobs:
  security-fixes:
    name: Scan and patch yarn.lock
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          # Do not leave any credentials in .git/config for the rest of the job: the
          # repository is public, and the steps that need write access authenticate
          # explicitly with RELEASE_TOKEN.
          persist-credentials: false

      - name: Install osv-scanner
        run: |
          BASE="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}"
          curl -fsSL -o osv-scanner "${BASE}/osv-scanner_linux_amd64"
          # Verify against the checksum file from the *same* pinned tag. That pins
          # integrity without a hard-coded hash that would rot on every version bump,
          # so Renovate can keep OSV_SCANNER_VERSION current on its own.
          curl -fsSL -o SHA256SUMS "${BASE}/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' SHA256SUMS | sed 's/_linux_amd64$//' | sha256sum -c -
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/
          rm SHA256SUMS

      - name: Scan lockfile
        run: |
          # yarn.lock is a first-class standalone target - no package.json needed.
          # `--lockfile` is current in v2; it is `--output` that was deprecated.
          set +e
          osv-scanner scan source --lockfile "./${LOCKFILE}" \
            --format json --output-file "${RUNNER_TEMP}/osv.json"
          code=$?
          set -e
          # 0 = clean, 1 = findings, 127 = error, 128 = no packages found. Handled
          # precisely on purpose: a blanket `|| true` would turn "the scan broke" into
          # "nothing to fix" and silently do nothing every week.
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error::osv-scanner exited with $code"
            exit "$code"
          fi

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Apply resolutions
        id: apply
        run: |
          node .github/scripts/apply-npm-resolutions.mjs \
            --scan "${RUNNER_TEMP}/osv.json" \
            --gradle "${GRADLE_FILE}" \
            --md "${RUNNER_TEMP}/pr-body.md"
          cat "${RUNNER_TEMP}/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Java
        if: steps.apply.outputs.changed == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        if: steps.apply.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Regenerate yarn.lock
        if: steps.apply.outputs.changed == 'true'
        run: ./gradlew kotlinUpgradeYarnLock

      # Check and Build runs this again on the PR, but running it here is a pre-flight
      # gate: kotlinUpgradeYarnLock will happily write a lockfile for a resolution that
      # yarn then cannot build. Failing here means no PR is opened at all, which is the
      # right failure mode. This mirrors the `build` job of check-and-build.yml.
      # detekt/ktlintCheck are pointless - their source sets are Kotlin, so they never
      # look at build.gradle.kts.
      - name: Verify the build
        if: steps.apply.outputs.changed == 'true'
        run: ./gradlew :web:jsBrowserProductionWebpack

      - name: Re-scan and report
        if: steps.apply.outputs.changed == 'true'
        run: |
          set +e
          osv-scanner scan source --lockfile "./${LOCKFILE}" \
            --format markdown --output-file "${RUNNER_TEMP}/after.md"
          set -e
          {
            echo ''
            echo '### Remaining advisories after the fix'
            echo ''
            cat "${RUNNER_TEMP}/after.md" 2>/dev/null || echo 'Scan produced no output.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push branch
        id: push
        if: steps.apply.outputs.changed == 'true' && inputs.dry_run != true
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # The numeric prefix is what attributes the commit to the bot account;
          # `main protection` requires an extra approval for unattributed changes.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add "$GRADLE_FILE" "$LOCKFILE"
          git commit -m "fix(deps): patch high-severity npm advisories in yarn.lock"

          # Push with the PAT rather than GITHUB_TOKEN: a push made by GITHUB_TOKEN
          # triggers no further workflow, so Check and Build would never run on this
          # branch and the merge gate below would wait forever. Passed inline so the
          # credential is scoped to this one command and never lands in .git/config.
          #
          # The branch has a fixed name and is always recreated from develop, so a
          # plain --force is correct: --force-with-lease would be a lottery here, since
          # the ref was never fetched. The force-push is a PAT push, so it fires
          # `synchronize` and checks re-run on the updated head.
          git push --force \
            "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"

      - name: Open or update the pull request
        id: pr
        if: steps.push.conclusion == 'success' && steps.apply.outputs.changed == 'true' && inputs.dry_run != true
        env:
          # Same reason as the push: a PR opened with GITHUB_TOKEN does not trigger the
          # `pull_request` event, so its checks would never report at all.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # `gh pr create --label` hard-fails on a label the repository does not have,
          # so make sure both exist first. `--force` makes this a no-op once created.
          gh label create dependencies --color 0366d6 --force \
            --description "Dependency updates"
          gh label create security --color d93f0b --force \
            --description "Security fixes"

          TITLE="fix(deps): patch ${{ steps.apply.outputs.count }} high-severity npm advisories"
          EXISTING=$(gh pr list --head "$BRANCH" --base develop --state open \
            --json number -q '.[0].number')

          if [ -z "$EXISTING" ]; then
            URL=$(gh pr create --base develop --head "$BRANCH" \
              --title "$TITLE" --body-file "${RUNNER_TEMP}/pr-body.md" \
              --label dependencies --label security)
          else
            # Editing keeps the existing thread, so review comments survive a rerun.
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "${RUNNER_TEMP}/pr-body.md"
            URL=$(gh pr view "$EXISTING" --json url -q '.url')
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Merge once checks pass
        if: steps.pr.outputs.url
        env:
          # Must not be GITHUB_TOKEN: the merge push has to trigger downstream
          # workflows the same way a human merge would.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # Deliberately *not* `gh pr merge --auto`. GitHub only offers auto-merge on a
          # PR that cannot merge immediately, so with no required status checks on
          # `develop` --auto either errors with "Pull request is in clean status" or,
          # in the UNKNOWN window right after creation, succeeds and merges before
          # Check and Build has even started. Waiting on the checks explicitly is the
          # only way to genuinely gate this.
          #
          # Give the checks a moment to register: with none reported yet, `gh pr
          # checks` exits 1 rather than waiting.
          sleep 30
          gh pr checks "${{ steps.pr.outputs.url }}" --watch --fail-fast --interval 30
          gh pr merge "${{ steps.pr.outputs.url }}" --squash --delete-branch

      - name: Close a stale pull request
        if: steps.apply.outputs.changed != 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # Nothing left to fix - if a PR from an earlier run is still open, its fixes
          # arrived another way (Renovate, or a manual bump) and it is now noise.
          EXISTING=$(gh pr list --head "$BRANCH" --base develop --state open \
            --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh pr close "$EXISTING" --delete-branch \
              --comment "No HIGH or CRITICAL advisory remains in \`$LOCKFILE\`; closing."
          else
            echo "Nothing to fix and no open PR."
          fi
